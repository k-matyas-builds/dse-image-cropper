<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSE image cropper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%233B92FF'/><stop offset='1' stop-color='%23066FEF'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><path d='M11 6.5v14.5h14.5M6.5 11h14.5v14.5' fill='none' stroke='white' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>
try { var themePref = localStorage.getItem('dse-cropper-theme'); } catch (e) {}
document.documentElement.dataset.theme = themePref === 'light' || themePref === 'dark' ? themePref
  : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
</script>
<style>
:root{
  color-scheme:dark;
  /* The image surround stays dark in both themes, so crops and compression are judged on neutral grey. */
  --stage:#1C1D21;
  --empty-bg:#1C1D21;
  --review-bg:rgba(22,23,26,.9);
  --img-ring:0 0 0 1px rgba(255,255,255,.06);
  --ambient:
    radial-gradient(42% 46% at 30% 34%,rgba(6,111,239,.34),transparent 70%),
    radial-gradient(46% 50% at 72% 70%,rgba(0,24,120,.6),transparent 72%),
    radial-gradient(30% 32% at 64% 26%,rgba(70,190,230,.14),transparent 70%);
  /* Chrome: follows the system theme */
  --ink:#F4F6FA;
  --ink-2:rgba(236,240,247,.68);
  --ink-3:rgba(236,240,247,.44);
  --line:rgba(255,255,255,.09);
  --well:rgba(255,255,255,.055);
  --hover:rgba(255,255,255,.07);
  --hover-2:rgba(255,255,255,.1);
  --open:rgba(255,255,255,.085);
  --sep:rgba(255,255,255,.14);
  --track:rgba(255,255,255,.16);
  --tick:rgba(255,255,255,.6);
  --scroll:rgba(255,255,255,.2);
  --glass-bg:linear-gradient(180deg,rgba(68,71,80,.54),rgba(36,38,44,.64));
  --glass-shadow:0 30px 60px -18px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.1);
  --glass-rim:linear-gradient(155deg,rgba(255,255,255,.52),rgba(255,255,255,.1) 22%,rgba(255,255,255,.03) 55%,rgba(255,255,255,.07) 80%,rgba(255,255,255,.3));
  --btn-bg:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.07));
  --btn-bg-hover:linear-gradient(180deg,rgba(255,255,255,.23),rgba(255,255,255,.1));
  --btn-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 0 0 1px rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.3);
  --field-bg:rgba(0,0,0,.24);
  --field-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 2px rgba(0,0,0,.3);
  --seg-bg:rgba(0,0,0,.25);
  --seg-ring:inset 0 0 0 1px rgba(255,255,255,.07);
  --seg-on:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));
  --seg-on-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.3);
  --pill-bg:rgba(255,255,255,.1);
  --pill-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.14);
  --thumb-ring:0 0 0 1px rgba(255,255,255,.1);
  --tile-ink:rgba(255,255,255,.92);
  --link:#2997FF;
  --accent:#066FEF;
  --accent-2:#4B97FF;
  --accent-soft:rgba(6,111,239,.26);
  --accent-ring:inset 0 0 0 1px rgba(75,151,255,.45);
  --ok:#4AD17F;
  --warn:#FFB340;
  --bad:#FF6A5F;
  --warn-ink:#FFB340;
  --note-warn-bg:rgba(255,179,64,.12); --note-warn-ink:#FFD18F;
  --note-bad-bg:rgba(255,106,95,.14);  --note-bad-ink:#FFB3AC;
  --gap:12px;
  --panel-w:372px;
  --ease:cubic-bezier(.22,.9,.24,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI Variable Text","Segoe UI",sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI Variable Display","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--stage);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

/* Light theme: set by the system, or by the appearance switcher */
:root[data-theme="light"]{
  color-scheme:light;
  --stage:#E3E4E7;
  --empty-bg:#E3E4E7;
  --review-bg:rgba(227,228,231,.94);
  --img-ring:0 0 0 1px rgba(0,0,0,.07);
  --ambient:
    radial-gradient(42% 46% at 30% 34%,rgba(6,111,239,.16),transparent 70%),
    radial-gradient(46% 50% at 72% 70%,rgba(120,160,255,.22),transparent 72%),
    radial-gradient(30% 32% at 64% 26%,rgba(90,200,230,.16),transparent 70%);
  --ink:#1D1D1F;
  --ink-2:rgba(29,29,31,.66);
  --ink-3:rgba(29,29,31,.46);
  --line:rgba(0,0,0,.08);
  --well:rgba(0,0,0,.035);
  --hover:rgba(0,0,0,.05);
  --hover-2:rgba(0,0,0,.07);
  --open:rgba(0,0,0,.045);
  --sep:rgba(0,0,0,.12);
  --track:rgba(0,0,0,.13);
  --tick:rgba(0,0,0,.45);
  --scroll:rgba(0,0,0,.22);
  --glass-bg:linear-gradient(180deg,rgba(255,255,255,.95),rgba(248,249,251,.91));
  --glass-shadow:0 26px 56px -18px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.95);
  --glass-rim:linear-gradient(155deg,rgba(255,255,255,1),rgba(255,255,255,.5) 24%,rgba(0,0,0,.07) 58%,rgba(0,0,0,.04) 80%,rgba(255,255,255,.8));
  --btn-bg:linear-gradient(180deg,#fff,rgba(255,255,255,.78));
  --btn-bg-hover:linear-gradient(180deg,#fff,#fff);
  --btn-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.1),0 2px 6px -2px rgba(0,0,0,.08);
  --field-bg:rgba(255,255,255,.75);
  --field-shadow:inset 0 0 0 1px rgba(0,0,0,.11),inset 0 1px 2px rgba(0,0,0,.05);
  --seg-bg:rgba(0,0,0,.06);
  --seg-ring:inset 0 0 0 .5px rgba(0,0,0,.06);
  --seg-on:#fff;
  --seg-on-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.06);
  --pill-bg:rgba(255,255,255,.93);
  --pill-shadow:inset 0 0 0 .5px rgba(0,0,0,.1),0 4px 14px -4px rgba(0,0,0,.35);
  --thumb-ring:0 0 0 .5px rgba(0,0,0,.14);
  --tile-ink:rgba(29,29,31,.72);
  --link:#0066CC;
  --accent-2:#0A63D6;
  --accent-soft:rgba(6,111,239,.12);
  --accent-ring:inset 0 0 0 1px rgba(6,111,239,.38);
  --ok:#34C759;
  --warn:#FF9500;
  --bad:#FF3B30;
  --warn-ink:#B35C00;
  --note-warn-bg:rgba(255,149,0,.12); --note-warn-ink:#8F4A00;
  --note-bad-bg:rgba(255,59,48,.1);   --note-bad-ink:#C4281C;
}

/* ---------- Glass ---------- */
.glass{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:var(--glass-shadow);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:var(--glass-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:999px;
  font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;
  background:var(--btn-bg);
  box-shadow:var(--btn-shadow);
  transition:background .15s,transform .12s}
.btn:hover:not(:disabled){background:var(--btn-bg-hover)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.icon{width:32px;padding:0;flex:none}

.btn-primary{position:relative;display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;border:0;border-radius:999px;
  font-size:15px;font-weight:600;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;
  background:linear-gradient(180deg,#3B92FF 0%,#066FEF 52%,#0563DA 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.18),0 8px 22px -6px rgba(6,111,239,.7),0 1px 2px rgba(0,0,0,.35);
  transition:filter .15s,transform .12s,opacity .2s}
.btn-primary::after{content:"";position:absolute;left:8%;right:8%;top:1px;height:48%;border-radius:999px 999px 60% 60%/100% 100% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));pointer-events:none}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-primary:disabled{opacity:.38;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

/* ---------- Stage ---------- */
.app{position:relative;height:100vh;height:100dvh;overflow:hidden}
.stage{position:absolute;inset:0;overflow:hidden;outline:none;touch-action:none;user-select:none;-webkit-user-select:none;
  background:var(--stage);transition:background-color .6s var(--ease)}
.app[data-phase="empty"] .stage{background:var(--empty-bg)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.framed canvas{cursor:grab}
.stage.framed.dragging canvas{cursor:grabbing}
.stage:focus-visible{outline:none}
.stage.framed:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-2)}

.ambient{position:absolute;inset:-10%;pointer-events:none;transition:opacity .7s var(--ease);
  background:var(--ambient);
  filter:blur(24px)}
.app:not([data-phase="empty"]) .ambient{opacity:0}

/* Empty state */
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;
  transition:opacity .4s var(--ease),transform .4s var(--ease),visibility 0s}
.app:not([data-phase="empty"]) .welcome{opacity:0;transform:scale(.97);visibility:hidden;transition:opacity .3s,transform .3s,visibility 0s .3s}
.w-tile{position:relative;display:grid;place-items:center;width:84px;height:84px;margin-bottom:24px;padding:0;border:0;border-radius:24px;color:var(--tile-ink);
  transition:transform .25s var(--ease),filter .2s}
.w-tile:hover{transform:scale(1.05);filter:brightness(1.15)}
.w-tile:active{transform:scale(.97)}
.w-title{margin:0;font:600 28px/1.14 var(--font-d);letter-spacing:.004em;color:var(--ink)}
.w-action{margin:8px 0 0;font:400 17px/1.47 var(--font);letter-spacing:-.022em;color:var(--ink-2)}
.w-link{padding:0;border:0;background:none;font:inherit;letter-spacing:inherit;color:var(--link)}
.w-link:hover{text-decoration:underline;text-underline-offset:3px}
.w-note{margin:20px 0 0;font:400 13px/1.38 var(--font);letter-spacing:-.008em;color:var(--ink-3)}

/* Prompt over the unframed image */
.prompt{position:absolute;left:0;top:0;transform:translate(var(--px,50%),var(--py,50%)) translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .35s var(--ease);z-index:1}
.prompt.show{opacity:1}
.prompt::before{content:"";position:absolute;inset:-96px -190px;border-radius:50%;
  background:rgba(18,19,22,.3);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  -webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%);mask:radial-gradient(closest-side,#000 30%,transparent 100%)}
.prompt span{position:relative;display:block;font:600 17px/1.2 var(--font-d);letter-spacing:-.012em;color:#fff;white-space:nowrap;text-shadow:0 1px 14px rgba(0,0,0,.5)}

.frame-label{position:absolute;top:0;left:0;display:inline-flex;align-items:center;gap:10px;height:28px;padding:0 12px;border-radius:999px;
  background:var(--pill-bg);box-shadow:var(--pill-shadow);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;opacity:0}
.frame-label:empty{display:none}
.frame-label .fl-name{color:var(--ink);font-weight:500}
.frame-label .fl-warn{color:var(--warn-ink)}

.drop-veil{position:absolute;inset:16px;display:grid;place-items:center;border-radius:28px;pointer-events:none;opacity:0;z-index:20;
  background:rgba(6,111,239,.16);box-shadow:inset 0 0 0 2px rgba(75,151,255,.8);transition:opacity .15s;
  font:600 17px var(--font-d);color:#fff}
.app.drop .drop-veil{opacity:1}

.toast{position:fixed;left:50%;top:18px;z-index:80;display:flex;align-items:center;gap:12px;max-width:min(580px,calc(100% - 32px));
  padding:10px 10px 10px 16px;border-radius:18px;font-size:13.5px;line-height:1.4;
  transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast[data-kind="error"] .toast-dot{background:var(--bad)}
.toast-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.toast .btn{height:28px;font-size:12.5px}

/* ---------- Panel ---------- */
.panel{position:absolute;top:var(--gap);right:var(--gap);bottom:var(--gap);z-index:5;width:var(--panel-w);display:flex;flex-direction:column;
  border-radius:26px;overflow:hidden;opacity:0;transform:translateX(calc(100% + 24px));
  transition:transform .56s var(--ease),opacity .3s}
.app.with-panel .panel{opacity:1;transform:none}
.panel-scroll{position:relative;flex:1;min-height:0;overflow:auto;padding:16px 14px 18px;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}

.source{display:flex;align-items:center;gap:12px;padding:4px 2px 4px 4px}
.src-thumb{flex:none;width:44px;height:44px;border-radius:11px;object-fit:cover;background:var(--well);box-shadow:var(--thumb-ring)}
.src-text{flex:1;min-width:0}
.src-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-meta{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.sec{margin-top:22px;transition:opacity .3s,filter .3s}
.sec h2{margin:0 6px 8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.off{opacity:.36;filter:saturate(.4);pointer-events:none}

/* Components accordion */
.comps{display:flex;flex-direction:column;gap:6px}
.comp{border-radius:16px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s}
.comp.open{background:var(--open)}
.comp-head{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px 0 14px;border:0;border-radius:16px;background:none;
  font-size:14px;font-weight:500;text-align:left}
.comp-head:hover{background:var(--hover)}
.ch-active{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--accent-2);font-variant-numeric:tabular-nums}
.ch-chev{flex:none;color:var(--ink-3);transition:transform .3s var(--ease)}
.ch-active:empty + .ch-chev{margin-left:auto}
.comp.open .ch-chev{transform:rotate(90deg)}
.comp-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ease)}
.comp.open .comp-body{grid-template-rows:1fr}
.comp-inner{min-height:0;overflow:hidden}
.comp-pad{padding:0 6px 8px}
.var-group{padding:8px 8px 4px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.var-group:first-child{padding-top:2px}
.var{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:8px;width:100%;min-height:38px;padding:6px 10px 6px 8px;border:0;border-radius:11px;background:none;
  font-size:13.5px;text-align:left;transition:background .15s}
.var:hover{background:var(--hover)}
.var[aria-pressed="true"]{background:var(--accent-soft);box-shadow:var(--accent-ring)}
.var-check{display:grid;place-items:center;color:var(--accent-2);visibility:hidden}
.var[aria-pressed="true"] .var-check{visibility:visible}
.var-ratio{margin-left:7px;color:var(--ink-3)}
.var-dims{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.var[aria-pressed="true"] .var-dims{color:var(--ink)}
.var-saved{width:6px;height:6px;border-radius:50%;background:var(--accent-2);opacity:.6}
.comp-note{margin:4px 8px 2px;font-size:12px;color:var(--ink-3)}

.custom-row{display:flex;align-items:flex-end;gap:8px;padding:2px 6px 6px}
.custom-row label{flex:1;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.input{display:block;width:100%;height:36px;margin-top:4px;padding:0 11px;border:0;border-radius:10px;outline:none;
  background:var(--field-bg);box-shadow:var(--field-shadow);
  font-size:14px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.input:focus{box-shadow:inset 0 0 0 1px rgba(75,151,255,.8),0 0 0 3px rgba(75,151,255,.25)}
.input[aria-invalid="true"]{box-shadow:inset 0 0 0 1px rgba(255,106,95,.8)}
.input::placeholder{color:var(--ink-3)}
.custom-row .times{padding-bottom:8px;color:var(--ink-3)}
.custom-row .btn.icon{height:36px;width:36px}
.field-err{margin:0 8px 6px;font-size:12px;color:var(--note-bad-ink)}

/* Framing toolbar, under the image */
.toolbar{position:absolute;left:0;top:0;z-index:4;display:flex;align-items:center;gap:4px;height:48px;padding:0 7px;border-radius:999px;
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.toolbar.show{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s}
.toolbar input[type="range"]{width:200px;margin:0 4px}
.toolbar output{min-width:42px;padding-right:2px;text-align:right;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tb-sep{flex:none;width:1px;height:22px;margin:0 6px;background:var(--sep)}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;min-width:34px;padding:0 12px;border:0;border-radius:999px;background:none;
  font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .15s,box-shadow .15s}
.tb-btn.icon{padding:0}
.tb-btn:hover:not(:disabled){background:var(--hover-2)}
.tb-btn:disabled{opacity:.35}
.tb-btn[aria-pressed="true"]{background:var(--accent-soft);box-shadow:var(--accent-ring)}

/* Text preview: split button with an options popover */
.tb-split{position:relative;display:inline-flex;align-items:center;border-radius:999px;transition:background .15s,box-shadow .15s}
.tb-split.on{background:var(--accent-soft);box-shadow:var(--accent-ring)}
.tb-split .tb-btn[aria-pressed="true"]{background:none;box-shadow:none}
.tb-split.on #textToggle{padding-right:8px;border-radius:999px 0 0 999px}
.tb-split .tb-chev{position:relative;min-width:30px;width:30px;padding:0 2px 0 0;border-radius:0 999px 999px 0}
.tb-split .tb-chev::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:currentColor;opacity:.22}
.tb-chev svg{transition:transform .2s var(--ease)}
.tb-chev[aria-expanded="true"] svg{transform:rotate(180deg)}
.tb-pop{position:absolute;right:-7px;bottom:calc(100% + 14px);z-index:6;width:330px;padding:14px;border-radius:20px;text-align:left;
  transform-origin:bottom right;animation:popIn .22s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pop-title{margin:0;font:600 13.5px var(--font);color:var(--ink)}
.pop-cta{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button:disabled{opacity:.35;cursor:default}
.pop-row + .pop-row{margin-top:14px}
.pop-label{display:block;margin-bottom:6px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.seg.seg-fill{display:flex;width:100%}
.seg.seg-fill button{flex:1;min-width:0;padding:0 6px;white-space:nowrap}
.pop-note{margin:0;font-size:12.5px;color:var(--ink-2)}
.switch{position:relative;display:inline-flex;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{position:relative;width:38px;height:22px;border-radius:11px;background:var(--track);transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .25s var(--ease)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent-2);outline-offset:2px}

input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;--pct:0%}
input[type="range"]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--range-fill,var(--accent-2)) var(--pct),var(--track) var(--pct))}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.25);transition:transform .12s}
input[type="range"]:active::-webkit-slider-thumb{transform:scale(1.08)}
input[type="range"]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type="range"]::-moz-range-progress{height:4px;border-radius:2px;background:var(--range-fill,var(--accent-2))}
input[type="range"]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
input[type="range"]:disabled{opacity:.5}

.note{margin:12px 0 0;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
.note.warn{background:var(--note-warn-bg);color:var(--note-warn-ink)}
.note.bad{background:var(--note-bad-bg);color:var(--note-bad-ink)}

/* Panel footer */
.panel-foot{position:relative;padding:14px;border-top:1px solid var(--line);transition:opacity .3s}
.panel-foot{display:flex;align-items:center;gap:10px}
.panel-foot .btn-primary{flex:1;min-width:0}
.panel-foot .theme-btn{width:44px;height:44px}
.panel-foot.off .btn-primary{opacity:.38}
.panel-foot.off{opacity:1;filter:none;pointer-events:auto}
.theme-btn svg{display:none}
.theme-btn[data-pref="auto"] .ti-auto,.theme-btn[data-pref="light"] .ti-light,.theme-btn[data-pref="dark"] .ti-dark{display:block}
.w-theme{position:absolute;top:16px;right:16px}

/* Traffic lights (review) */
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--sep);transition:background .2s,box-shadow .2s}
[data-state="ok"] .dot{background:var(--ok);box-shadow:0 0 8px rgba(74,209,127,.55)}
[data-state="warn"] .dot{background:var(--warn);box-shadow:0 0 8px rgba(255,179,64,.55)}
[data-state="bad"] .dot{background:var(--bad);box-shadow:0 0 8px rgba(255,106,95,.55)}

/* ---------- Review ---------- */
.review{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:var(--gap);
  background:var(--review-bg);-webkit-backdrop-filter:blur(36px) saturate(1.2);backdrop-filter:blur(36px) saturate(1.2);
  animation:rvIn .34s var(--ease)}
@keyframes rvIn{from{opacity:0}to{opacity:1}}
.review .rv-bar,.review .rv-dock{animation:rvRise .44s var(--ease)}
@keyframes rvRise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

.rv-bar{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 8px 8px 20px;border-radius:999px}
.rv-title{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;white-space:nowrap;overflow:hidden}
.rv-title strong{font:600 15px var(--font-d);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.rv-title span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--seg-bg);box-shadow:var(--seg-ring)}
.seg button{height:26px;padding:0 12px;border:0;border-radius:999px;background:none;font-size:12.5px;font-weight:500;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--seg-on);box-shadow:var(--seg-on-shadow)}

.rv-main{position:relative;min-height:0}
.rv-body{position:absolute;inset:0;overflow:hidden;border-radius:20px;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.rv-body.actual{overflow:auto}
.rv-canvas{display:grid;place-items:center;min-width:100%;min-height:100%;width:max-content;height:max-content;padding:8px}
.rv-stack{position:relative;flex:none;box-shadow:0 20px 50px -10px rgba(0,0,0,.45),var(--img-ring);cursor:zoom-in}
.rv-body.actual .rv-stack{cursor:grab}
.rv-body.panning .rv-stack{cursor:grabbing}
.rv-stack canvas,.rv-stack img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none}
.rv-stack.raw img{visibility:hidden}
.rv-stack.pending{opacity:.55;transition:opacity .2s}
.rv-state{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.rv-state.raw{color:#fff;background:rgba(6,111,239,.6)}

.rv-dock{position:relative;display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.25fr) auto;align-items:center;gap:14px 28px;padding:16px 16px 16px 22px;border-radius:26px}
.field{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.name-input{display:flex;align-items:center;margin-top:5px;border-radius:10px;background:var(--field-bg);box-shadow:var(--field-shadow)}
.name-input:focus-within{box-shadow:inset 0 0 0 1px rgba(75,151,255,.8),0 0 0 3px rgba(75,151,255,.25)}
.name-input input{flex:1 1 auto;min-width:0;height:36px;padding:0 0 0 11px;border:0;background:none;outline:none;font-size:14px;font-weight:400;color:var(--ink)}
@supports (field-sizing:content){.name-input input{flex:0 1 auto;field-sizing:content;min-width:2ch;max-width:calc(100% - 110px)}.name-input span{flex:1}}
.name-input span{padding-right:11px;font-size:14px;font-weight:400;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}

.quality-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.quality-head label{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.quality-head output{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.q-track{position:relative;margin-top:3px}
.q-track input{position:relative;z-index:1}
.q-tick{position:absolute;top:50%;width:2px;height:14px;margin:-7px 0 0 -1px;border-radius:1px;background:var(--tick);pointer-events:none}
.quality[data-weight="warn"]{--range-fill:var(--warn)}
.quality[data-weight="bad"]{--range-fill:var(--bad)}
.quality-foot{position:relative;height:18px;margin-top:1px}
.q-fit{position:absolute;top:0;padding:0;border:0;background:none;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.q-fit:not(:disabled):hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.q-fit:disabled{cursor:default}

.rv-out{display:flex;align-items:center;gap:18px}
.t-short{display:none}
.status{display:flex;flex-direction:column;gap:7px;width:320px}
.st-row{display:grid;grid-template-columns:8px auto minmax(0,1fr);align-items:baseline;column-gap:9px;font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.st-row .dot{align-self:start;margin-top:5px}
.st-row strong{font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.st-row > span:last-child{text-wrap:balance}
.st-row[data-state="busy"] > span:last-child{opacity:.6}
@media (max-width:1240px) and (min-width:861px){
  .rv-dock{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rv-out{grid-column:1 / -1;justify-content:space-between}
}

@media (max-width:860px){
  .panel{top:auto;left:var(--gap);width:auto;max-height:54vh;transform:translateY(calc(100% + 24px))}
  .w-title{font-size:24px}
  .w-action{font-size:15px}
  .review{gap:8px}
  .rv-dock{grid-template-columns:minmax(0,1fr);gap:12px;padding:14px;border-radius:22px}
  .rv-out{flex-wrap:wrap;gap:10px}
  .status{width:100%}
  .rv-out .btn-primary{width:100%}
  .rv-bar{border-radius:22px;flex-wrap:wrap;gap:8px;padding:10px 10px 10px 14px}
  .rv-title{flex-basis:100%}
  .rv-state{display:none}
  .t-long{display:none}.t-short{display:inline}
  .rv-bar #rvBack{margin-left:auto}
  .toolbar{gap:2px;padding:0 5px}
  .toolbar input[type="range"]{width:96px}
  .tb-text{display:none}
  .tb-btn{padding:0 8px}
  .tb-sep{margin:0 2px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important}
}
</style>

<body>
<div class="app" id="app" data-phase="empty">
  <main class="stage" id="stage" tabindex="-1" aria-label="Image preview">
    <div class="ambient" aria-hidden="true"></div>
    <canvas id="view"></canvas>
    <div class="frame-label" id="frameLabel" aria-hidden="true"></div>
    <div class="prompt" id="prompt" aria-hidden="true"><span id="promptText">Choose a component</span></div>

    <section class="welcome" id="welcome">
      <button class="btn icon theme-btn w-theme" type="button" data-pref="auto"><svg class="ti-auto" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.75"/><path d="M8 2.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor" stroke="none"/></svg><svg class="ti-light" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg><svg class="ti-dark" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.25 9.6A5.75 5.75 0 1 1 6.4 2.75a4.6 4.6 0 0 0 6.85 6.85z"/></svg></button>
      <button class="w-tile glass" id="pickTile" type="button" aria-label="Select an image from your computer" title="Select an image">
        <svg width="48" height="48" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="8" width="30" height="24" rx="5.5"/><circle cx="14" cy="16" r="2.6"/><path d="M6.5 28.5l8-7.5 6 5.5 4.5-4 8.5 7"/>
        </svg>
      </button>
      <h1 class="w-title">Drag in an image</h1>
      <p class="w-action">or <button class="w-link" id="pickBtn" type="button">select from your computer</button></p>
      <p class="w-note">JPG or PNG</p>
    </section>

    <div class="toolbar glass" id="toolbar" role="toolbar" aria-label="Framing">
      <button class="tb-btn icon" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">
        <svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 7h9"/></svg>
      </button>
      <input type="range" id="zoom" min="0" max="1000" value="0" aria-label="Zoom">
      <button class="tb-btn icon" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">
        <svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 7h9M7 2.5v9"/></svg>
      </button>
      <output id="zoomVal">100%</output>
      <span class="tb-sep" aria-hidden="true"></span>
      <button class="tb-btn" id="gridToggle" type="button" aria-pressed="true" title="Rule-of-thirds grid">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="1.75" width="12.5" height="12.5" rx="2.5"/><path d="M6 2v12M10 2v12M2 6h12M2 10h12"/></svg>
        <span class="tb-text">Grid</span>
      </button>
      <button class="tb-btn" id="resetBtn" type="button" title="Reset framing. Shortcut: 0">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.75 8a5.25 5.25 0 1 0 1.6-3.78"/><path d="M2.5 2.25v3.25h3.25"/></svg>
        <span class="tb-text">Reset</span>
      </button>
      <span class="tb-sep" id="textSep" aria-hidden="true" hidden></span>
      <div class="tb-split" id="textCtl" hidden>
        <button class="tb-btn" id="textToggle" type="button" aria-pressed="false" title="Preview where the component's text sits">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3.5h10M8 3.5v9.5"/></svg>
          <span class="tb-text">Text</span>
        </button>
        <button class="tb-btn tb-chev" id="textMenuBtn" type="button" aria-expanded="false" aria-controls="textPop" aria-label="Text preview options" title="Text preview options">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5L6 4.5l3 3"/></svg>
        </button>
        <div class="tb-pop glass" id="textPop" role="dialog" aria-label="Text preview options" hidden>
          <div class="pop-head">
            <p class="pop-title">Text preview</p>
            <label class="pop-cta">CTA<span class="switch"><input type="checkbox" id="textCta" checked aria-label="Call to action"><span class="track"></span></span></label>
          </div>
          <div class="pop-row">
            <span class="pop-label">Placement</span>
            <div class="seg seg-fill" role="group" aria-label="Placement">
              <button type="button" data-place="top-left" aria-pressed="false">Top left</button>
              <button type="button" data-place="bottom-left" aria-pressed="false">Bottom left</button>
              <button type="button" data-place="centre-bottom" aria-pressed="false">Bottom centre</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="drop-veil" aria-hidden="true">Drop to open</div>
  </main>

  <aside class="panel glass" id="panel" aria-label="Crop settings">
    <div class="panel-scroll">
      <div class="source">
        <img class="src-thumb" id="srcThumb" alt="">
        <div class="src-text">
          <div class="src-name" id="srcName"></div>
          <div class="src-meta" id="srcMeta"></div>
        </div>
        <button class="btn" id="replaceBtn" type="button">Replace</button>
        <button class="btn icon" id="clearBtn" type="button" aria-label="Close image" title="Close image">
          <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
        </button>
      </div>

      <section class="sec" aria-labelledby="sizeHead">
        <h2 id="sizeHead">Size</h2>
        <div class="comps" id="comps"></div>
        <p class="note warn" id="upNote" hidden></p>
      </section>

    </div>

    <footer class="panel-foot off" id="panelFoot">
      <button class="btn icon theme-btn" type="button" data-pref="auto"><svg class="ti-auto" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.75"/><path d="M8 2.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor" stroke="none"/></svg><svg class="ti-light" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg><svg class="ti-dark" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.25 9.6A5.75 5.75 0 1 1 6.4 2.75a4.6 4.6 0 0 0 6.85 6.85z"/></svg></button>
      <button class="btn-primary" id="reviewBtn" type="button" disabled>Review and download</button>
    </footer>
  </aside>
</div>

<div class="review" id="review" role="dialog" aria-modal="true" aria-labelledby="rvTitle" hidden>
  <header class="rv-bar glass">
    <div class="rv-title"><strong id="rvTitle"></strong><span id="rvDims"></span></div>
    <span class="rv-state" id="rvState" aria-live="polite">Compressed JPG</span>
    <div class="seg" role="group" aria-label="Preview scale">
      <button type="button" id="rvFit" aria-pressed="true">Fit to window</button>
      <button type="button" id="rvActual" aria-pressed="false">Full size</button>
    </div>
    <button class="btn" id="rvCompare" type="button" title="Shows the crop without JPG compression while you hold it. Space works too."><span class="t-long">Hold to see original</span><span class="t-short">Original</span></button>
    <button class="btn" id="rvBack" type="button">Back to crop</button>
  </header>

  <div class="rv-main">
    <div class="rv-body" id="rvBody">
      <div class="rv-canvas">
        <div class="rv-stack" id="rvStack"><canvas id="rvRaw"></canvas><img id="rvImg" alt="Compressed JPG preview" draggable="false"></div>
      </div>
    </div>
  </div>

  <footer class="rv-dock glass">
    <label class="field">File name
      <span class="name-input"><input id="baseName" spellcheck="false" autocomplete="off"><span id="nameSuffix"></span></span>
    </label>
    <div class="quality" id="qualityBox">
      <div class="quality-head"><label for="quality">JPG quality</label><output id="qualityVal" for="quality">–</output></div>
      <div class="q-track"><span class="q-tick" id="qTick" hidden></span><input type="range" id="quality" min="30" max="100" step="1" value="92"></div>
      <div class="quality-foot"><button class="q-fit" id="qFit" type="button" hidden title="Set quality to the highest that fits the limit"></button></div>
    </div>
    <div class="rv-out">
      <div class="status" aria-live="polite">
        <div class="st-row" id="stWeight" data-state="idle"><span class="dot"></span><strong id="stWeightVal">–</strong><span id="stWeightMsg"></span></div>
        <div class="st-row" id="stQuality" data-state="idle"><span class="dot"></span><strong>Quality</strong><span id="stQualityMsg"></span></div>
      </div>
      <button class="btn-primary" id="downloadBtn" type="button" disabled>Download JPG</button>
    </div>
  </footer>
</div>

<div class="toast glass" id="toast" aria-live="polite">
  <span class="toast-dot"></span><span id="toastText"></span>
  <button class="btn" id="toastClose" type="button">Dismiss</button>
</div>

<input type="file" id="fileInput" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>

<script>
(() => {
'use strict';

/* ---------- Settings ---------- */
const KB = 1024;              // bytes per KB. 1024 (the Windows way) is the more tolerant reading of 180 KB.
const DSE_LIMIT_KB = 180;     // DSE file weight limit
const Q_TOP = 92;             // highest quality the automatic fit tries
const Q_BOTTOM = 30;          // lowest quality, for the automatic fit and the review slider
const Q_MAX = 100;            // highest quality the review slider allows
const WEIGHT_MARGIN_KB = 250; // file weight: green up to the DSE limit, amber up to here, red above
const Q_GOOD = 60;            // compression: green at or above this quality
const Q_POOR = 45;            // compression: red below this quality, amber in between
const UPSCALE_SOFT_PCT = 150; // upscaling: amber up to this, red above
const MAX_ZOOM = 8;           // relative to the smallest zoom that fills the frame
const QUALITY_SETTLE_MS = 500; // wait after the quality slider stops before re-encoding

const COMPONENTS = [
  { id:'hero', code:'bbds', text:'billboard', name:'Hero banner', groups:[
    { label:'', items:[
      { name:'Desktop', ratio:'16:9', w:1920, h:1080 },
      { name:'Mobile',  ratio:'9:16', w:780,  h:1385 } ]} ]},
  { id:'banner', code:'bbds', text:'banner', name:'Banner', groups:[
    { label:'Desktop', items:[
      { name:'Default', ratio:'16:9', w:1920, h:1080 },
      { name:'Short',   ratio:'16:7', w:1920, h:840 },
      { name:'Skinny',  ratio:'24:5', w:1920, h:400 } ]},
    { label:'Mobile', items:[
      { name:'Default', ratio:'9:16', w:780,  h:1385 },
      { name:'Short',   ratio:'3:4',  w:780,  h:1040 },
      { name:'Square',  ratio:'1:1',  w:1000, h:1000 } ]} ]},
  { id:'large', code:'lcds', text:'large', name:'Large card', groups:[
    { label:'Desktop', items:[
      { name:'Default', ratio:'16:9', w:1920, h:1080 },
      { name:'Short',   ratio:'16:7', w:1920, h:840 } ]},
    { label:'Mobile', items:[
      { name:'Default',    ratio:'9:16', w:780,  h:1385 },
      { name:'Short',      ratio:'3:4',  w:780,  h:1040 },
      { name:'Square',     ratio:'1:1',  w:1000, h:1000 },
      { name:'Widescreen', ratio:'16:9', w:1920, h:1080 } ]} ]},
  { id:'feature', code:'fcds', name:'Feature card', groups:[
    { label:'', items:[
      { name:'Desktop', ratio:'', w:1000, h:1147 },
      { name:'Mobile',  ratio:'', w:780,  h:1035 } ]} ]},
  { id:'small', code:'scds', name:'Small card', groups:[
    { label:'', items:[
      { name:'Landscape', ratio:'3:2', w:1000, h:667 },
      { name:'Square',    ratio:'1:1', w:1000, h:1000 } ]} ]},
  { id:'column', code:'ccds', name:'Column card', groups:[

            `<span class="var-dims"><span class="var-saved" hidden title="Framing kept for this size"></span>${it.w} ${X} ${it.h}</span>`);

  }

  els.cw = $('cw'); els.ch = $('ch'); els.customErr = $('customErr');
  let customTimer = 0;
  const onCustom = () => { clearTimeout(customTimer); customTimer = setTimeout(applyCustom, 400); };

/* ---------- Interaction ---------- */
function localPoint(clientX, clientY){
  const b = els.canvas.getBoundingClientRect();
  return { x:clientX - b.left, y:clientY - b.top };
}
function frameCenter(){ const F = frameRect(); return { x:F.x + F.w / 2, y:F.y + F.h / 2 }; }

function zoomAt(z, p){
  const c = getCrop(); const F = frameRect(); const r = cropRect(c);
  const rx = (p.x - F.x) / F.w, ry = (p.y - F.y) / F.h;
  const sx = r.x + rx * r.w, sy = r.y + ry * r.h;
  c.z = clamp(z, 1, MAX_ZOOM);
  const r2 = cropRect(c);
  c.cx = sx - rx * r2.w + r2.w / 2;
  c.cy = sy - ry * r2.h + r2.h / 2;
  clampCrop(c);
}

let gridTimer = 0;
function beginInteract(){ clearTimeout(gridTimer); S.interacting = true; }
function endInteract(){ clearTimeout(gridTimer); gridTimer = setTimeout(() => { S.interacting = false; requestDraw(); }, 650); }

function changed(){
  requestDraw(); syncZoomUI(); updateCropInfo(); syncComps();
  invalidate();
}

const pointers = new Map(); let pinch = null;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

els.canvas.addEventListener('pointerdown', e => {
  if (!framed() || e.button > 0) return;
  dismissHint();
  els.canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d:dist(a, b) || 1, z:getCrop().z }; }
  beginInteract(); els.stage.classList.add('dragging'); requestDraw();
});
els.canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); const cur = { x:e.clientX, y:e.clientY };
  pointers.set(e.pointerId, cur);
  if (pointers.size === 1) {
    const c = getCrop(); const k = frameRect().w / cropRect(c).w;
    c.cx -= (cur.x - prev.x) / k; c.cy -= (cur.y - prev.y) / k;
    clampCrop(c);
  } else if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    zoomAt(pinch.z * dist(a, b) / pinch.d, localPoint((a.x + b.x) / 2, (a.y + b.y) / 2));
  }
  changed();
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { els.stage.classList.remove('dragging'); endInteract(); }
}
els.canvas.addEventListener('pointerup', endPointer);
els.canvas.addEventListener('pointercancel', endPointer);

els.canvas.addEventListener('wheel', e => {
  if (!framed()) return;
  e.preventDefault(); dismissHint();
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
  const f = Math.exp(-e.deltaY * unit * (e.ctrlKey ? 0.01 : 0.0015));
  beginInteract();
  zoomAt(getCrop().z * f, localPoint(e.clientX, e.clientY));
  changed(); endInteract();
}, { passive:false });

els.stage.addEventListener('keydown', e => {
  if (!framed() || e.target !== els.stage) return;
  const c = getCrop(); const k = frameRect().w / cropRect(c).w;
  const step = (e.shiftKey ? 50 : 10) / k;
  switch (e.key) {
    case 'ArrowLeft':  c.cx += step; break;
    case 'ArrowRight': c.cx -= step; break;
    case 'ArrowUp':    c.cy += step; break;
    case 'ArrowDown':  c.cy -= step; break;
    case '+': case '=': zoomAt(c.z * 1.1, frameCenter()); break;
    case '-': case '_': zoomAt(c.z / 1.1, frameCenter()); break;
    case '0': resetFraming(); return e.preventDefault();
    default: return;
  }
  e.preventDefault(); clampCrop(c);
  beginInteract(); changed(); endInteract();
});

els.zoom.addEventListener('input', () => {
  if (!framed()) return;
  beginInteract();
  zoomAt(Math.pow(MAX_ZOOM, els.zoom.value / 1000), frameCenter());
  changed();
});
els.zoom.addEventListener('change', endInteract);
els.zoomIn.addEventListener('click', () => { zoomAt(getCrop().z * 1.25, frameCenter()); changed(); });
els.zoomOut.addEventListener('click', () => { zoomAt(getCrop().z / 1.25, frameCenter()); changed(); });
els.gridToggle.addEventListener('click', () => {
  S.grid = !S.grid; els.gridToggle.setAttribute('aria-pressed', String(S.grid)); requestDraw();
});

function resetFraming(){
  if (!framed()) return;
  startGeoAnim();
  S.crops[S.sel] = { cx:S.imgW / 2, cy:S.imgH / 2, z:1 };
  changed();
}
els.resetBtn.addEventListener('click', resetFraming);

/* ---------- Text preview ---------- */
function textLayout(){
  const t = target();
  if (!S.text.on || !S.img || !t || !t.text) return null;
  return { t, sp:TEXT_SPECS[t.text].w[t.screen === 'mobile' ? 'm' : 'd'], cta:TEXT_SPECS[t.text].cta, place:textPlace(t) };
}
// On mobile the live page puts bottom-centre text bottom left, so the preview does too.
function textPlace(t){
  const place = S.text.place[t.text];
  return t.screen === 'mobile' && place === 'centre-bottom' ? 'bottom-left' : place;
}
// 1 if Ford Antenna is installed, otherwise how much wider Antenna is than the fallback font at this weight.
const fontStretch = {};
function textStretch(fw){
  const bold = fw >= 600, key = bold ? 'bold' : 'regular';
  if (fontStretch[key] != null) return fontStretch[key];
  ctx.save();
  ctx.font = '40px monospace'; const mono = ctx.measureText('Your new Ford').width;
  ctx.font = `40px ${TEXT_FONT.split(', "Helvetica Neue"')[0]}, monospace`; const antenna = ctx.measureText('Your new Ford').width;
  let k = 1;
  if (antenna === mono) {                      // no Antenna on this machine
    const refs = ANTENNA_REF.filter(r => (r.fw >= 600) === bold);
    k = refs.reduce((sum, r) => { setFont(r, r.fs); const m = ctx.measureText(r.text); return sum + r.w / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight); }, 0) / refs.length;
    k = clamp(k, .9, 1.3);
  }
  ctx.restore();
  return fontStretch[key] = k;
}
function setFont(f, px){
  ctx.font = `${f.fw} ${px}px ${TEXT_FONT}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${f.ls * px / f.fs}px`;
}
// The template line breaks are the reference, so a line only breaks further if it overshoots the column by 5%.
function wrapLines(text, f, maxW, st){
  setFont(f, f.fs);
  const lines = []; let cur = '';
  for (const word of text.split(' ')) {
    const test = cur ? cur + ' ' + word : word;
    if (cur && ctx.measureText(test).width * st > maxW * 1.05) { lines.push(cur); cur = word; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines.map(line => ({ line, w:ctx.measureText(line).width * st }));
}
// Draws text stretched horizontally by st, anchored at x on the left or, for 'center', in the middle.
function stretchedText(str, x, y, st, align){
  ctx.save(); ctx.translate(x, y); ctx.scale(st, 1); ctx.textAlign = align; ctx.fillText(str, 0, 0); ctx.restore();
}
// Draws the component's gradient, headline, body and CTA inside the frame, laid out as on the live page.
function drawTextPreview(F, alpha){
  const L = textLayout(); if (!L) return;
  const { t, sp } = L, c = sp.cta, k = F.w / sp.wc, Hc = sp.wc * t.h / t.w;
  const copy = TEXT_COPY[t.screen === 'mobile' ? 'm' : 'd'];
  const bottom = L.place !== 'top-left', centre = L.place === 'centre-bottom';
  const X = v => F.x + v * k, Y = v => F.y + v * k;
  const stH = textStretch(sp.h.fw), stB = textStretch(sp.b.fw), stC = textStretch(c.fw);
  ctx.save();
  ctx.beginPath(); ctx.rect(F.x, F.y, F.w, F.h); ctx.clip();
  ctx.globalAlpha = alpha;
  // Keep the template's line breaks, and only break further if a line doesn't fit the column.
  const head = copy.head.flatMap(l => wrapLines(l, sp.h, sp.col, stH));
  const body = copy.body.flatMap(l => wrapLines(l, sp.b, sp.col, stB));
  const headH = head.length * sp.h.lh + sp.h.x, bodyH = body.length * sp.b.lh + sp.b.x;
  const wrapH = sp.pad[0] + headH + bodyH + (S.text.cta ? c.gap + c.h + c.tail + sp.pad[2] : sp.padBn);
  const wy = bottom ? Hc - wrapH : 0;
  const colX = centre ? (sp.wc - sp.col) / 2 : sp.pad[3];

  const g = ctx.createLinearGradient(0, Y(wy), 0, Y(wy + wrapH));
  if (bottom) { g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.83, 'rgba(0,0,0,.8)'); g.addColorStop(1, 'rgba(0,0,0,.8)'); }
  else { g.addColorStop(0, 'rgba(0,0,0,.8)'); g.addColorStop(1, 'rgba(0,0,0,0)'); }
  ctx.fillStyle = g; ctx.fillRect(F.x, Y(wy), F.w, wrapH * k);

  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  let y = wy + sp.pad[0];
  const drawLines = (lines, f, st) => {
    setFont(f, f.fs * k);
    lines.forEach((l, i) => stretchedText(l.line, X(centre ? colX + (sp.col - l.w) / 2 : colX), Y(y + f.bl + i * f.lh), st, 'left'));
    y += lines.length * f.lh + f.x;
  };
  drawLines(head, sp.h, stH);
  drawLines(body, sp.b, stB);
  if (S.text.cta) {
    y += c.gap;
    setFont(c, c.fs);
    const bw = c.w || clamp(ctx.measureText(TEXT_COPY.cta).width * stC + c.padX * 2, c.minW, c.maxW);
    const bx = centre ? colX + (sp.col - bw) / 2 : colX;
    ctx.beginPath();
    if (L.cta === 'primary') { ctx.roundRect(X(bx), Y(y), bw * k, c.h * k, c.h / 2 * k); ctx.fillStyle = '#1700F4'; ctx.fill(); }
    else { ctx.roundRect(X(bx + 1), Y(y + 1), (bw - 2) * k, (c.h - 2) * k, c.h / 2 * k); ctx.lineWidth = 2 * k; ctx.strokeStyle = '#fff'; ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
    setFont(c, c.fs * k);
    stretchedText(TEXT_COPY.cta, X(bx + bw / 2), Y(y + c.h / 2), stC, 'center');
  }
  ctx.restore();
}

function openTextPop(){ els.textPop.hidden = false; els.textMenuBtn.setAttribute('aria-expanded', 'true'); }
function closeTextPop(){ els.textPop.hidden = true; els.textMenuBtn.setAttribute('aria-expanded', 'false'); }

}));

/* ---------- Output rendering & compression ---------- */
function renderOutput(t){
  const r = cropRect(getCrop());
  let sx = Math.max(0, r.x), sy = Math.max(0, r.y);
  let sw = Math.min(r.w, S.imgW - sx), sh = Math.min(r.h, S.imgH - sy);
  let src = S.img;
  // Halve in steps for big downscales; one large drawImage step aliases.
  while (sw >= t.w * 2 && sh >= t.h * 2) {
    const nw = Math.round(sw / 2), nh = Math.round(sh / 2);
    const tmp = document.createElement('canvas'); tmp.width = nw; tmp.height = nh;
    const tc = tmp.getContext('2d'); tc.imageSmoothingEnabled = true; tc.imageSmoothingQuality = 'high';
    tc.drawImage(src, sx, sy, sw, sh, 0, 0, nw, nh);
    src = tmp; sx = 0; sy = 0; sw = nw; sh = nh;
  }
  const out = document.createElement('canvas'); out.width = t.w; out.height = t.h;
  const oc = out.getContext('2d');
  oc.fillStyle = '#fff'; oc.fillRect(0, 0, t.w, t.h); // flattens PNG transparency onto white
  oc.imageSmoothingEnabled = true; oc.imageSmoothingQuality = 'high';
  oc.drawImage(src, sx, sy, sw, sh, 0, 0, t.w, t.h);
  return out;
}

const encode = (cv, q) => new Promise((res, rej) =>
  cv.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q / 100));

// Sizes only show in the review, so nothing is encoded until it opens.
function invalidate(){ S.gen++; S.auto = null; S.stale = true; }
function resetResult(){
  if (S.result) URL.revokeObjectURL(S.result.url);
  S.result = null; S.outCanvas = null; S.auto = null; S.manualQ = null; S.stale = false;
  clearTimeout(S.compressTimer);
}

// Highest quality between Q_BOTTOM and Q_TOP that stays under the DSE limit.
async function fitQuality(cv, gen){
  const cap = DSE_LIMIT_KB * KB;
  const top = await encode(cv, Q_TOP); if (gen !== S.gen) return null;
  if (top.size <= cap) return { blob:top, q:Q_TOP, fits:true };
  const low = await encode(cv, Q_BOTTOM); if (gen !== S.gen) return null;
  if (low.size > cap) return { blob:low, q:Q_BOTTOM, fits:false };
  let pick = { blob:low, q:Q_BOTTOM, fits:true }, lo = Q_BOTTOM, hi = Q_TOP; // lo fits, hi doesn't
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    const b = await encode(cv, mid); if (gen !== S.gen) return null;
    if (b.size <= cap) { lo = mid; pick = { blob:b, q:mid, fits:true }; } else hi = mid;
  }
  return pick;
}

async function compress(){
  if (!framed()) return;
  const gen = ++S.gen; S.stale = true; renderReview();
  const t = target();
  let blob, q;
  try {
    if (!S.auto) {
      const cv = renderOutput(t);
      const auto = await fitQuality(cv, gen); if (!auto) return;
      S.outCanvas = cv; S.auto = auto;
      drawRaw();
    }
    q = S.manualQ ?? S.auto.q;
    blob = q === S.auto.q ? S.auto.blob : await encode(S.outCanvas, q);
    if (gen !== S.gen) return;
  } catch {
    if (gen === S.gen) { S.stale = false; toast('The browser couldn\u2019t encode this JPG. Try a smaller custom size or reload the page.', 'error'); renderReview(); }
    return;
  }
  if (S.result) URL.revokeObjectURL(S.result.url);
  S.stale = false;
  S.result = { blob, q, url:URL.createObjectURL(blob), bytes:blob.size, w:t.w, h:t.h };
  els.rvImg.src = S.result.url;
  renderReview();
}

function renderReview(){
  if (!S.reviewOpen) return;
  const r = S.result, a = S.auto;
  const busy = S.stale || !r;

  // Quality slider, with a tick where the automatic fit landed.
  const q = S.manualQ ?? a?.q ?? Q_TOP;
  els.quality.value = q; setRangeFill(els.quality);
  els.qualityVal.textContent = (a || S.manualQ != null) ? `${q}%` : '\u2013';
  const tick = !!(a && a.fits);
  els.qTick.hidden = els.qFit.hidden = !tick;
  if (tick) {
    const pct = (a.q - Q_BOTTOM) / (Q_MAX - Q_BOTTOM);
    els.qTick.style.left = els.qFit.style.left = `calc(10px + (100% - 20px) * ${pct})`;
    els.qFit.style.transform = pct > .8 ? 'translateX(-100%)' : pct < .2 ? 'none' : 'translateX(-50%)';
    els.qFit.textContent = q === a.q ? `Fits ${DSE_LIMIT_KB} KB` : `Back to ${DSE_LIMIT_KB} KB fit`;
    els.qFit.disabled = q === a.q;
  }
  // Traffic lights: one for file weight, one for image quality.
  if (busy) {
    els.stWeight.dataset.state = els.stQuality.dataset.state = 'busy';
    els.stWeightVal.textContent = r ? fmtKB(r.bytes) : '\u2013';
    els.stWeightMsg.textContent = 'Compressing\u2026';
    if (!r) els.stQualityMsg.textContent = '';
  } else {
    const w = weightState(r.bytes), qs = qualityStatus(r.q);
    els.stWeight.dataset.state = w; els.stWeightVal.textContent = fmtKB(r.bytes); els.stWeightMsg.textContent = WEIGHT_MSG[w];
    els.stQuality.dataset.state = qs.state; els.stQualityMsg.textContent = qs.msg;
    els.qualityBox.dataset.weight = w;
  }
  els.downloadBtn.disabled = busy;
  els.rvStack.classList.toggle('pending', busy && !!r);
}

const WEIGHT_MSG = {
  ok:'File weight OK',
  warn:'A little over the limit, within the accepted margin for keeping quality',
  bad:'Well over, may slow the page down'
};
const RANK = { ok:0, warn:1, bad:2 };
// Anything that displays as the limit counts as within it, so "180 KB" is never flagged.
function weightState(bytes){
  return bytes < (DSE_LIMIT_KB + 0.5) * KB ? 'ok' : bytes < (WEIGHT_MARGIN_KB + 0.5) * KB ? 'warn' : 'bad';
}
function qualityStatus(q){
  const comp = q >= Q_GOOD ? 'ok' : q >= Q_POOR ? 'warn' : 'bad';
  const up = upscalePct();
  const ups = !up ? 'ok' : up <= UPSCALE_SOFT_PCT ? 'warn' : 'bad';
  let msg;
  if (comp === 'ok' && ups === 'ok') msg = 'Looks good';
  else if (ups === 'ok') msg = comp === 'warn' ? 'Some compression, check edges and gradients' : 'Heavy compression, blocky patches likely';
  else if (comp === 'ok') msg = ups === 'warn' ? `Upscaled ${up}%, may look a little soft` : `Upscaled ${up}%, will look soft`;
  else msg = `${comp === 'bad' ? 'Heavy' : 'Some'} compression, and upscaled ${up}%`;
  return { state:RANK[comp] >= RANK[ups] ? comp : ups, msg };
}

let qTimer = 0;
els.quality.addEventListener('input', () => {
  S.manualQ = Number(els.quality.value);
  S.gen++; S.stale = true; renderReview();   // the label moves live; encoding waits for the slider to settle
  clearTimeout(qTimer); qTimer = setTimeout(compress, QUALITY_SETTLE_MS);
});
els.qFit.addEventListener('click', () => { S.manualQ = null; clearTimeout(qTimer); compress(); });

/* ---------- Review ---------- */
let rvReturn = null;
function openReview(){
  const t = target(); if (!t || S.reviewOpen) return;
  closeTextPop();
  S.reviewOpen = true; rvReturn = document.activeElement;
  els.review.hidden = false;
  els.rvTitle.textContent = t.label;
  els.rvDims.textContent = `${t.w} ${X} ${t.h}`;
  els.nameSuffix.textContent = nameTail();
  els.downloadBtn.textContent = `Download ${t.w} ${X} ${t.h} JPG`;
  setMode('fit');
  if (S.stale || !S.result) {
    if (!S.auto) { els.rvImg.removeAttribute('src'); els.rvRaw.width = 0; }
    compress();
  } else { drawRaw(); els.rvImg.src = S.result.url; renderReview(); }
  els.rvBack.focus();
}
function closeReview(){
  if (!S.reviewOpen) return;
  S.reviewOpen = false; setRaw(false);
  els.review.hidden = true;
  (rvReturn && rvReturn.isConnected ? rvReturn : els.reviewBtn).focus?.();
}
function drawRaw(){
  if (!S.outCanvas) return;
  els.rvRaw.width = S.outCanvas.width; els.rvRaw.height = S.outCanvas.height;
  els.rvRaw.getContext('2d').drawImage(S.outCanvas, 0, 0);
  sizeStack();
}
function sizeStack(){
  const t = target(); if (!t) return;
  let s = 1;
  if (S.rvMode === 'fit') {
    const bw = els.rvBody.clientWidth - 16, bh = els.rvBody.clientHeight - 16;
    s = Math.min(1, bw / t.w, bh / t.h);
  }
  els.rvStack.style.width = Math.round(t.w * s) + 'px';
  els.rvStack.style.height = Math.round(t.h * s) + 'px';
}
function setMode(mode, at){
  const t = target();
  const prevRect = els.rvStack.getBoundingClientRect();
  S.rvMode = mode;
  els.rvBody.classList.toggle('actual', mode === 'actual');
  els.rvFit.setAttribute('aria-pressed', String(mode === 'fit'));
  els.rvActual.setAttribute('aria-pressed', String(mode === 'actual'));
  sizeStack();
  if (mode === 'actual' && t) {
    // Keep the clicked point under the pointer, or center the image.
    const bodyRect = els.rvBody.getBoundingClientRect();
    const fx = at ? (at.x - prevRect.left) / prevRect.width : 0.5;
    const fy = at ? (at.y - prevRect.top) / prevRect.height : 0.5;
    const ox = at ? at.x - bodyRect.left : bodyRect.width / 2;
    const oy = at ? at.y - bodyRect.top : bodyRect.height / 2;
    const stackRect = els.rvStack.getBoundingClientRect();
    const baseX = stackRect.left - bodyRect.left + els.rvBody.scrollLeft;
    const baseY = stackRect.top - bodyRect.top + els.rvBody.scrollTop;
    els.rvBody.scrollLeft = baseX + fx * t.w - ox;
    els.rvBody.scrollTop = baseY + fy * t.h - oy;
  }
}
function setRaw(on){
  els.rvStack.classList.toggle('raw', on);
  els.rvState.classList.toggle('raw', on);
  els.rvState.textContent = on ? 'Original quality' : 'Compressed JPG';
}

els.reviewBtn.addEventListener('click', openReview);
els.rvBack.addEventListener('click', closeReview);
els.rvFit.addEventListener('click', () => setMode('fit'));
els.rvActual.addEventListener('click', () => setMode('actual'));
els.rvCompare.addEventListener('pointerdown', () => setRaw(true));
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => els.rvCompare.addEventListener(t, () => setRaw(false)));
els.rvCompare.addEventListener('keydown', e => { if (e.key === 'Enter') setRaw(true); });
els.rvCompare.addEventListener('keyup', e => { if (e.key === 'Enter') setRaw(false); });

// Click the image to switch between fit to window and full size. At full size, drag to pan.
let pan = null;
els.rvStack.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  pan = { x:e.clientX, y:e.clientY, sl:els.rvBody.scrollLeft, st:els.rvBody.scrollTop, moved:false };
  els.rvStack.setPointerCapture(e.pointerId);
});
els.rvStack.addEventListener('pointermove', e => {
  if (!pan) return;
  const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
  if (!pan.moved && Math.hypot(dx, dy) > 4) { pan.moved = true; if (S.rvMode === 'actual') els.rvBody.classList.add('panning'); }
  if (pan.moved && S.rvMode === 'actual') { els.rvBody.scrollLeft = pan.sl - dx; els.rvBody.scrollTop = pan.st - dy; }
});
els.rvStack.addEventListener('pointerup', e => {
  if (!pan) return;
  const wasMoved = pan.moved; pan = null; els.rvBody.classList.remove('panning');
  if (!wasMoved) setMode(S.rvMode === 'fit' ? 'actual' : 'fit', { x:e.clientX, y:e.clientY });
});
els.rvStack.addEventListener('pointercancel', () => { pan = null; els.rvBody.classList.remove('panning'); });

els.downloadBtn.addEventListener('click', () => {
  if (!S.result || S.stale) return;
  const name = fileName();
  const a = document.createElement('a');
  a.href = S.result.url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  closeReview();
  toast(`Downloaded ${name}, ${fmtKB(S.result.bytes)}`);
});

document.addEventListener('keydown', e => {
  if (!S.reviewOpen) return;
  const typing = e.target instanceof HTMLInputElement && e.target.type !== 'range';
  if (e.key === 'Escape') { e.preventDefault(); closeReview(); }
  else if (e.key === ' ' && !typing && e.target.tagName !== 'BUTTON') { e.preventDefault(); setRaw(true); }
  else if (e.key === 'Tab') {
    const f = [...els.review.querySelectorAll('button:not(:disabled),input')].filter(x => x.offsetParent !== null);
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
}, true);
document.addEventListener('keyup', e => {
  if (S.reviewOpen && e.key === ' ') setRaw(false);
}, true);

/* ---------- Appearance ---------- */
const THEME_KEY = 'dse-cropper-theme';
const THEME_ORDER = ['auto', 'light', 'dark'];
const THEME_NAMES = { auto:'Auto', light:'Light', dark:'Dark' };
// Colours the canvas draws with: the veil outside the crop, the frame line and corners, the image shadow.
const PAINT = {
  dark:  { veil:'22,23,26',    veilA:.8,  line:'rgba(255,255,255,.9)', corner:'#fff',    shadow:.55 },
  light: { veil:'227,228,231', veilA:.82, line:'rgba(29,29,31,.75)',   corner:'#1D1D1F', shadow:.22 }
};
const mqLight = matchMedia('(prefers-color-scheme: light)');
let themePref = 'auto', paint = PAINT[document.documentElement.dataset.theme] || PAINT.dark;
try { themePref = THEME_ORDER.includes(localStorage.getItem(THEME_KEY)) ? localStorage.getItem(THEME_KEY) : 'auto'; } catch {}

function applyTheme(){
  const theme = themePref === 'auto' ? (mqLight.matches ? 'light' : 'dark') : themePref;
  document.documentElement.dataset.theme = theme;
  paint = PAINT[theme];
  const next = THEME_ORDER[(THEME_ORDER.indexOf(themePref) + 1) % THEME_ORDER.length];
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.dataset.pref = themePref;
    b.title = `Appearance: ${THEME_NAMES[themePref]}`;
    b.setAttribute('aria-label', `Appearance: ${THEME_NAMES[themePref]}. Switch to ${THEME_NAMES[next]}`);
  });
  requestDraw();
}
document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => {
  themePref = THEME_ORDER[(THEME_ORDER.indexOf(themePref) + 1) % THEME_ORDER.length];
  try { localStorage.setItem(THEME_KEY, themePref); } catch {}
  applyTheme();
  toast(`Appearance: ${THEME_NAMES[themePref]}${themePref === 'auto' ? ', following your system' : ''}`);
}));
mqLight.addEventListener('change', () => { if (themePref === 'auto') applyTheme(); });

/* ---------- Toast ---------- */
let toastTimer = 0;
function toast(msg, kind = 'info'){
  els.toastText.textContent = msg;
  els.toast.dataset.kind = kind;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, kind === 'error' ? 8000 : 3500);
}
function hideToast(){ els.toast.classList.remove('show'); }
els.toastClose.addEventListener('click', hideToast);

/* ---------- Loading ---------- */
// Checks the file's first bytes, so a renamed or mislabelled file is caught too.
async function sniff(blob){
  const b = new Uint8Array(await blob.slice(0, 8).arrayBuffer());
  if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'jpg';
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'png';
  return null;
}

async function loadBlob(blob, name){
  if (!blob) return false;
  if (!(await sniff(blob))) {
    toast(`\u201c${name || 'This file'}\u201d isn\u2019t a JPG or PNG. Export it as JPG or PNG and try again.`, 'error');
    return false;
  }
  const url = URL.createObjectURL(blob);
  const img = new Image(); img.src = url;
  try { await img.decode(); if (!img.naturalWidth) throw new Error('empty'); }
  catch {
    URL.revokeObjectURL(url);
    toast(`\u201c${name || 'This file'}\u201d couldn\u2019t be opened. The file may be damaged. Export it again and retry.`, 'error');
    return false;
  }
  hideToast();
  if (S.imgUrl) URL.revokeObjectURL(S.imgUrl);
  resetResult(); clearTimeout(S.compressTimer);
  const first = !S.img;
  Object.assign(S, { img, imgUrl:url, imgW:img.naturalWidth, imgH:img.naturalHeight, fileName:name || 'Pasted image', fileSize:blob.size,
    crops:{}, lastCenter:null, sel:null });
  lastGeo = null; geoAnim = null;

  els.baseName.value = sanitizeBase(S.fileName);
  els.srcThumb.src = url;
  els.srcName.textContent = S.fileName; els.srcName.title = S.fileName;
  els.srcMeta.textContent = `${S.imgW} ${X} ${S.imgH}, ${fmtSize(S.fileSize)}`;

  els.app.dataset.phase = 'loaded';
  els.welcome.inert = true;
  if (first) setPanel(true);
  onTargetChange();
  els.stage.focus({ preventScroll:true });
  return true;
}

function closeImage(){
  closeReview();
  if (S.imgUrl) URL.revokeObjectURL(S.imgUrl);
  resetResult(); clearTimeout(S.compressTimer);
  Object.assign(S, { img:null, imgUrl:null, imgW:0, imgH:0, fileName:'', fileSize:0, crops:{}, lastCenter:null, sel:null, open:null });
  lastGeo = null; geoAnim = null;
  els.srcThumb.removeAttribute('src');
  els.app.dataset.phase = 'empty';
  els.welcome.inert = false;
  setPanel(false);
  onTargetChange();
}

const openPicker = () => els.fileInput.click();
els.pickBtn.addEventListener('click', openPicker);
$('pickTile').addEventListener('click', openPicker);
els.replaceBtn.addEventListener('click', openPicker);
els.clearBtn.addEventListener('click', closeImage);
els.fileInput.addEventListener('change', () => { const f = els.fileInput.files[0]; els.fileInput.value = ''; if (f) loadBlob(f, f.name); });

const dragKind = e => [...(e.dataTransfer?.types || [])].includes('Files') ? 'file' : null;
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (S.reviewOpen || !dragKind(e)) return; e.preventDefault(); dragDepth++; els.app.classList.add('drop'); });
window.addEventListener('dragover', e => { if (!S.reviewOpen && dragKind(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
window.addEventListener('dragleave', e => {
  if (!dragKind(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) els.app.classList.remove('drop');
});
window.addEventListener('drop', e => {
  const kind = dragKind(e);
  if (!kind || S.reviewOpen) return;
  e.preventDefault(); dragDepth = 0; els.app.classList.remove('drop');
  const f = e.dataTransfer.files[0];
  if (f) loadBlob(f, f.name);
});

/* ---------- Boot ---------- */
new ResizeObserver(() => {
  const b = els.stage.getBoundingClientRect();
  view.W = b.width; view.H = b.height; view.dpr = window.devicePixelRatio || 1;
  els.canvas.width = Math.round(b.width * view.dpr);
  els.canvas.height = Math.round(b.height * view.dpr);
  draw();
}).observe(els.stage);
window.addEventListener('resize', () => { if (S.reviewOpen && S.rvMode === 'fit') sizeStack(); });
mqMobile.addEventListener('change', requestDraw);

els.quality.min = Q_BOTTOM; els.quality.max = Q_MAX;
els.panel.inert = true;
els.toolbar.inert = true;
applyTheme();
renderComps();
onTargetChange();
})();
</script>
</body>
</html>
